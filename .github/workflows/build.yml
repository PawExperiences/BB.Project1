# Managed by BuildBoard -- edit via the Releaser or a CI-fix task.
name: BuildBoard CI

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (optional)
        required: false
      environment:
        description: Target environment (dev|staging|prod) -- suffixes the asset
        required: false
      publish:
        description: Publish the built artifact as a release asset (CI-native)
        required: false
        default: "false"

permissions:
  contents: read
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: maven:3.9-eclipse-temurin-21
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |-
          mvn -B -DskipTests=false package
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: buildboard-artifact
          path: target
          if-no-files-found: error

  publish:
    needs: build
    if: ${{ inputs.publish == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: buildboard-artifact
          path: ./_artifact
      - name: Publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          ver="${VERSION:-untagged}"
          suffix=""
          [ -n "$ENVIRONMENT" ] && suffix="_$ENVIRONMENT"
          asset="${GITHUB_REPOSITORY##*/}-v${ver}${suffix}.zip"
          (cd _artifact && zip -r "../$asset" .)
          gh release create "v$ver" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_REF_NAME" --title "v$ver" --notes "BuildBoard release $ver $ENVIRONMENT" 2>/dev/null || true
          gh release upload "v$ver" "$asset" --repo "$GITHUB_REPOSITORY" --clobber

  report-failure:
    needs: [build, publish]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update the CI-failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create ci-build-failure --repo "$GITHUB_REPOSITORY" --color B60205 --description "BuildBoard CI build is failing" 2>/dev/null || true
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label ci-build-failure --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" --repo "$GITHUB_REPOSITORY" --body "CI build failed again: $RUN_URL"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "CI build failed" --label ci-build-failure \
              --body "The BuildBoard CI build (\`.github/workflows/build.yml\`) failed.

          Run: $RUN_URL

          This workflow needs fixing. BuildBoard imports this issue as an Inbox task; develop it to update the workflow, then the merge closes this issue."
          fi
