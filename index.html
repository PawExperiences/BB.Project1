<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Space Invaders</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    #gameCanvas {
      display: block;
      background-color: #000;
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas" width="768" height="896"></canvas>
  <script type="module" src="game.js"></script>
</body>
</html>
