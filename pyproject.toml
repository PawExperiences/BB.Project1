[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linkcheck"
version = "0.1.0"
description = "Extract and validate links in a single Markdown file."
requires-python = ">=3.9"

[project.scripts]
linkcheck = "linkcheck.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
