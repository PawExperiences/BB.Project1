[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "factorlib"
version = "0.1.0"
requires-python = ">=3.12"

[project.scripts]
factorlib = "factorlib.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
factorlib = ["py.typed"]
