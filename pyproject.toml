[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mdpdf"
version = "0.1.0"
description = "Convert a subset of Markdown into a self-contained, print-ready HTML document."
readme = "README.md"
requires-python = ">=3.8"

[project.scripts]
mdpdf = "mdpdf.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
