[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "linkcheck"
version = "0.1.0"
description = "Scans a Markdown file for syntactically broken links"
readme = "README.md"
requires-python = ">=3.9"

[project.scripts]
linkcheck = "linkcheck.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
